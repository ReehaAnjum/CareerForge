{% extends "base.html" %}
{% block title %}Log in · CareerForge{% endblock %}
{% block content %}
  <section class="auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Log in to CareerForge</h1>
    <p class="muted">Pick up where you left off and keep moving forward.</p>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username
        <input name="username" autocomplete="username" required value="{{ request.form.get('username', '') }}">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="button" type="submit">Log in</button>
    </form>
    <p class="form-footnote">New to CareerForge? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </section>
{% endblock %}
